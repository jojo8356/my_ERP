name: CI — ERP CLI Rust

on:
  push:
  pull_request:

jobs:
  # Recette complète sans base de données : c'est le mode par défaut de l'ERP
  # (fichiers locaux pilotés par le schéma Rustorm).
  recette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recette complète (test-all.sh, sans base)
        run: |
          set +e
          bash test-all.sh --rapide > /tmp/test-all.log 2>&1; code=$?
          tail -60 /tmp/test-all.log
          if [ $code -ne 0 ]; then
            # Les journaux d'actions ne sont pas lisibles hors GitHub : le
            # résumé et la fin de la sortie partent en annotation.
            python3 -c "import sys; d=open('/tmp/test-all.log',encoding='utf-8',errors='replace').read()[-6000:]; print('::error::'+d.replace('%','%25').replace('\n','%0A'))"
          fi
          exit $code
      - name: Diagnostic (erreurs et échecs de test dans l'onglet Annotations)
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          chemin = "/tmp/test-all.log"
          if os.path.exists(chemin):
              lignes = open(chemin, encoding="utf-8", errors="replace").read().splitlines()
              print(f"::group::{chemin} ({len(lignes)} lignes)")
              for i, ligne in enumerate(lignes):
                  interessant = (
                      ligne.startswith("error")
                      or ligne.startswith("---- ")
                      or " panicked at " in ligne
                      or ligne.lstrip().startswith(("left:", "right:"))
                      or "assertion" in ligne
                      or ligne.lstrip().startswith("✗")
                  )
                  if interessant:
                      for extra in [ligne] + lignes[i + 1:i + 4]:
                          if extra.strip():
                              print("::error::" + extra.replace("%", "%25"))
              print("::endgroup::")
          PY

  # Le même ERP, mais l'état vit dans PostgreSQL : Rustorm crée le schéma
  # (migration), puis lit et écrit toutes les tables dans une transaction.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ERP_DATABASE_URL: postgres://erp:erp@127.0.0.1:5432/erp
    steps:
      - uses: actions/checkout@v4
      - name: libpq (connecteur PostgreSQL de Rustorm)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev
      - name: Recette complète avec base (feature postgres)
        run: |
          set +e
          bash test-all.sh --features postgres --bdd "$ERP_DATABASE_URL" > /tmp/test-all-pg.log 2>&1; code=$?
          tail -80 /tmp/test-all-pg.log
          if [ $code -ne 0 ]; then
            python3 -c "import sys; d=open('/tmp/test-all-pg.log',encoding='utf-8',errors='replace').read()[-6000:]; print('::error::'+d.replace('%','%25').replace('\n','%0A'))"
          fi
          exit $code
      - name: Diagnostic PostgreSQL
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          chemin = "/tmp/test-all-pg.log"
          if os.path.exists(chemin):
              lignes = open(chemin, encoding="utf-8", errors="replace").read().splitlines()
              print("::group::journal PostgreSQL")
              for i, ligne in enumerate(lignes):
                  if (ligne.startswith("error")
                          or " panicked at " in ligne
                          or ligne.lstrip().startswith("✗")
                          or "PostgreSQL" in ligne):
                      for extra in [ligne] + lignes[i + 1:i + 4]:
                          if extra.strip():
                              print("::error::" + extra.replace("%", "%25"))
              print("::endgroup::")
          PY
