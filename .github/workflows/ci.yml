name: CI — ERP CLI Rust

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler (zéro dépendance, hors-ligne)
        run: cargo build --verbose
      - name: Tests unitaires et métier
        run: cargo test --verbose
      - name: Scénario complet (persistance fichier, process séparés)
        run: |
          export ERP_DONNEES_DIR=/tmp/erp-demo
          cargo run --quiet -- /clients nouveau --nom "Atelier Dupont" --type pro --email contact@example.fr
          cargo run --quiet -- /factures nouvelle --client dupont --activite services --ligne "Maintenance informatique;2;500,00;2000"
          cargo run --quiet -- /factures FA-2026-0001 valider
          cargo run --quiet -- /factures FA-2026-0001 payer
          cargo run --quiet -- /factures FA-2026-0001 | grep "payée"
          cargo run --quiet -- /vinted nouveau --marque Zara --description "Veste" --taille M --composition "100 % coton" --prix-achat 8,00
          ID_ARTICLE=$(cargo run --quiet -- /vinted | awk 'NR==1 {print $1}')
          cargo run --quiet -- /vinted vendre "$ID_ARTICLE" --prix 25,00 --frais 2,00
          cargo run --quiet -- /vinted stats | grep "marge nette"
          cargo run --quiet -- /compta seuils | grep "CA global"
          cargo run --quiet -- /compta fec | head -3
          test -f /tmp/erp-demo/etat.tsv && echo "persistance OK"

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clippy (informatif)
        run: rustup component add clippy >/dev/null 2>&1; cargo clippy 2>&1 | tail -5 || true
