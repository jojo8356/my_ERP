[package]
name = "my-erp"
version = "0.1.0"
edition = "2021"
description = "ERP CLI en Rust — navigation par chemins, sans GUI (voir CDC-ERP-CLI.md)"
license = "MIT"

# Seule dépendance : Chromat, la bibliothèque de couleurs terminal de
# l'utilisateur (elle-même sans aucune dépendance). Voir ADR-004.
[dependencies]
chromat = { git = "https://github.com/jojo8356/chromat", tag = "v0.1.1" }

[profile.release]
opt-level = 3
