name: CI — ERP CLI Rust

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compiler
        run: cargo build --verbose
      - name: Tests (sortie versée au résumé du run en cas d'échec)
        run: |
          set +e
          cargo test -- --nocapture > /tmp/tests.log 2>&1
          code=$?
          { echo '## Résultats cargo test'; echo '```'; tail -80 /tmp/tests.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Fumée CLI (mode mémoire)
        run: |
          cargo run --quiet -- --memoire /clients "nouveau" --nom "Atelier Dupont" --type pro --email contact@example.fr
          cargo run --quiet -- --memoire /compta seuils
      - name: Test d'intégration PostgreSQL (connexion + schéma)
        env:
          ERP_DATABASE_URL: postgres://erp:erp@localhost:5432/erp
        run: cargo run --quiet -- /admin sante

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Rust + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (informatif)
        run: cargo clippy -- -D warnings || true
