name: CI — ERP CLI Rust

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler (Chromat + Rustorm Git, Ratatui/Crossterm crates.io, ADR-004/005/006)
        run: |
          set +e
          cargo build > /tmp/build.log 2>&1; code=$?
          tail -5 /tmp/build.log; exit $code
      - name: Tests unitaires et métier
        run: |
          set +e
          cargo test > /tmp/tests.log 2>&1; code=$?
          tail -5 /tmp/tests.log; exit $code
      - name: Scénario complet (persistance fichier, process séparés)
        run: |
          set +e
          export ERP_DONNEES_DIR=/tmp/erp-demo
          bash scripts/scenario-demo.sh > /tmp/scenario.log 2>&1; code=$?
          tail -30 /tmp/scenario.log; exit $code
      - name: Diagnostic (digest des erreurs dans une annotation unique)
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re

          def interessant(ligne):
              return (
                  ligne.startswith("error")
                  or ligne.startswith("---- ")
                  or " panicked at " in ligne
                  or ligne.lstrip().startswith(("left:", "right:"))
                  or "assertion" in ligne
                  or ligne.startswith("✅")
                  or "introuvable" in ligne
                  or "invalide" in ligne
              )

          morceaux = []
          for chemin in ("/tmp/tests.log", "/tmp/scenario.log", "/tmp/build.log"):
              if not os.path.exists(chemin):
                  continue
              lignes = open(chemin, encoding="utf-8", errors="replace").read().splitlines()
              bloc = []
              for i, ligne in enumerate(lignes):
                  if interessant(ligne):
                      bloc.extend(l for l in lignes[i:i + 6] if l.strip())
              if bloc:
                  morceaux.append(f"=== {chemin} ===")
                  morceaux.extend(bloc[:60])
          digest = "\n".join(morceaux)[:7000] or "aucune ligne d'erreur reconnue"
          print("::error::" + digest.replace("%", "%25").replace("\n", "%0A"))
          PY
